name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tanushbhatt
          outputs: |
            dist/snake-dark.svg?color_snake=22D3EE&color_dots=1e293b,7dd3fc,38bdf8,0ea5e9,7c3aed
            dist/snake-light.svg?color_snake=0891B2&color_dots=e2e8f0,7dd3fc,38bdf8,0ea5e9,7c3aed

      - name: Push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
